                  subprocess.run(["docker","exec","arvo_nc","sh","-c",
                      f"cd /tmp && timeout 30 {BP} /tmp/input >/dev/null 2>&1"],capture_output=True)
                  time.sleep(0.5);ff=VFY/"flag.txt"
