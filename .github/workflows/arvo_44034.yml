      - name: "Integrity gate (layer 1: transport)"
        run: |
          for f in verify.py agent.py fallback.py episode.py; do
            python3 -m py_compile "$f" || { echo "$f DOES NOT PARSE"; exit 1; }
          done
          grep -q SENTINEL-VERIFY-OK verify.py     || { echo "verify.py truncated"; exit 1; }
          grep -q SENTINEL-AGENT-OK agent.py       || { echo "agent.py truncated"; exit 1; }
          grep -q SENTINEL-FALLBACK-OK fallback.py || { echo "fallback.py truncated"; exit 1; }
          grep -q SENTINEL-EPISODE-OK episode.py   || { echo "episode.py truncated"; exit 1; }
          echo "layer 1 PASS: all files parse, sentinels present"

      - name: "VERIFY (layers 2+3: environment, detector, model identity)"
        env:
          GONKAROUTER_API_KEY: "${{ secrets.GONKAROUTER_API_KEY }}"
          TARGET_BIN: "${{ github.event.inputs.target_bin }}"
        run: python3 verify.py

      - name: "MARATHON (layer 4: agent session; fallback on harness-fatal)"
        if: ${{ inputs.verify_only != true }}
        env:
          GONKAROUTER_API_KEY: "${{ secrets.GONKAROUTER_API_KEY }}"
          HOURS: "${{ github.event.inputs.hours }}"
          WF_START: "${{ env.WF_START }}"
        run: |
          set +e
          python3 agent.py; code=$?
          echo "agent_exit=$code" | tee -a demo/output/exit.txt
          if [ "$code" -eq 2 ]; then
            echo "main harness fatal (exit 2) -> degraded fallback run"
            python3 fallback.py; fb=$?
            echo "fallback_exit=$fb" | tee -a demo/output/exit.txt
            exit $(( fb == 0 ? 0 : 1 ))
          fi
          exit $code

      - name: "Negative control + episode record (Part F anchors)"
        if: always()
        run: python3 episode.py

      - name: Summary
        if: always()
        run: |
          echo "=== verification.json ===";  cat demo/output/verification.json 2>/dev/null || true
          echo "=== fingerprint.json ===";    cat demo/output/fingerprint.json 2>/dev/null || true
          echo "=== episode.json ===";        cat demo/output/episode.json 2>/dev/null || true
          echo "=== result.json ===";         cat demo/output/result.json 2>/dev/null || true
          { echo "### arvo_44034 6h marathon result"
            echo '```json'; cat demo/output/episode.json 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          tail -n 40 demo/logs/agent.log 2>/dev/null || true

      - name: Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: arvo43406h, path: "demo/", retention-days: 30, if-no-files-found: warn}

      - name: Cleanup
        if: always()
        run: |
          docker rm -f arvo_target arvo_v arvo_t0 arvo_t1 arvo_final arvo_nc fbv 2>/dev/null || true
          echo "6h marathon finished"
